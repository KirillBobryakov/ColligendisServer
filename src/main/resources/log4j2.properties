status = error
name = MyAppLogConfig
packages = org.apache.logging.log4j.core

# ===============================
# Console appender
# ===============================
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %style{[%d{yyyy-MM-dd HH:mm:ss}]}{cyan} %highlight{[%-5p]}{FATAL=red blink, ERROR=red, WARN=orange, INFO=green, DEBUG=blue, TRACE=white} %style{%c{1}}{yellow} - %msg%n

# ===============================
# File appender
# ===============================
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = logs/app.log
appender.file.append = false
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%p] [%t] %c{1} - %msg%n

# Neo4j file appender
appender.neo4jFile.type = File
appender.neo4jFile.name = Neo4jFileAppender
appender.neo4jFile.fileName = logs/neo4j.log
appender.neo4jFile.append = false
appender.neo4jFile.layout.type = PatternLayout
appender.neo4jFile.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%p] [%t] %c{1} - %msg%n

# Numista Parser file appender
appender.numistaParserFile.type = File
appender.numistaParserFile.name = NumistaParserFileAppender
appender.numistaParserFile.fileName = logs/numistaParser.log
appender.numistaParserFile.append = false
appender.numistaParserFile.layout.type = PatternLayout
appender.numistaParserFile.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%p] [%t] %c{1} - %msg%n


# ===============================
# Log rotation (optional)
# ===============================
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = logs/app-rolling.log
appender.rolling.filePattern = logs/archive/app-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.append = false
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%p] %c{1.} [%t] - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5

# ===============================
# Loggers
# ===============================
logger.spring.name = org.springframework
logger.spring.level = warn

logger.neo4j.name = org.springframework.data.neo4j
logger.neo4j.level = warn
logger.neo4j.additivity = false
logger.neo4j.appenderRefs = console, neo4jFile
logger.neo4j.appenderRef.console.ref = ConsoleAppender
logger.neo4j.appenderRef.neo4jFile.ref = Neo4jFileAppender

logger.neo4jDriver.name = org.neo4j.driver
logger.neo4jDriver.level = info
logger.neo4jDriver.additivity = false
logger.neo4jDriver.appenderRefs = console, neo4jFile
logger.neo4jDriver.appenderRef.console.ref = ConsoleAppender
logger.neo4jDriver.appenderRef.neo4jFile.ref = Neo4jFileAppender

logger.app.name = bkv.colligendis
logger.app.level = warn
logger.app.additivity = false
logger.app.appenderRefs = console, file
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.file.ref = FileAppender

logger.numistaParser.name = bkv.colligendis.utils.numista.parser
logger.numistaParser.level = warn
logger.numistaParser.additivity = false
logger.numistaParser.appenderRefs = console, numistaParserFile
logger.numistaParser.appenderRef.console.ref = ConsoleAppender
logger.numistaParser.appenderRef.numistaParserFile.ref = NumistaParserFileAppender

# ===============================
# Root logger
# ===============================
rootLogger.level = warn
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender